<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Krisp Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;900&display=swap">
<style>
/* One fixed screen, no scroll. Composition is drawn in "u" units (1u ≈ 19px at 1920×1080) so it scales as one piece. */
:root {
  --bg-top: #1e1f38;
  --bg-bottom: #0b0d1a;
  --card: #777777;
  --fg: #f8f4f2;
  --field: #0b0c18;
  --field-line: #2b2c55;
  --lavender: #a99cf5;
  --lavender-strong: #c9bcff;
  --pink: #f4b4c8;
  --disabled-bg: #262a4c;
  --disabled-fg: #8b84d8;
  --error: #ff8a9b;
  --font: "Figtree", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --u: min(1vw, 1.78vh);
  color-scheme: dark;
}
@media (max-aspect-ratio: 1/1) { :root { --u: min(1.45vw, 1.6vh); } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) fixed;
  color: var(--fg); font-family: var(--font); -webkit-font-smoothing: antialiased;
}
.hidden { display: none !important; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; }

/* corner email */
.corner {
  position: fixed; z-index: 5;
  top: max(24px, env(safe-area-inset-top, 0px)); left: max(24px, env(safe-area-inset-left, 0px));
  width: 64px; height: 64px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  background: transparent; color: var(--fg); border: 1px solid #f8f4f255;
  transition: border-color .2s, background-color .2s;
}
.corner:hover { border-color: var(--fg); background: #ffffff0d; }
.corner svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.4; }
.toast {
  position: fixed; z-index: 5;
  top: calc(max(24px, env(safe-area-inset-top, 0px)) + 21px);
  left: calc(max(24px, env(safe-area-inset-left, 0px)) + 80px);
  font-size: 14px; font-weight: 600; color: var(--pink);
  opacity: 0; transform: translateX(-6px); transition: opacity .2s, transform .2s; pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }

/* stage */
.stage { position: fixed; inset: 0; display: grid; place-items: center; touch-action: none; }
.comp { position: relative; width: calc(60 * var(--u)); height: calc(50 * var(--u)); }

.hover-card, .hover-text, .flip-card, .flip-text { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }
.hover-text { pointer-events: none; }

.card {
  position: absolute; left: calc(13.7 * var(--u)); top: 0;
  width: calc(32.6 * var(--u)); height: calc(33.6 * var(--u));
  border-radius: calc(1.05 * var(--u)); background: var(--card); overflow: hidden;
  box-shadow: 0 calc(2.5 * var(--u)) calc(5 * var(--u)) calc(-2 * var(--u)) #00000099;
}
.glare {
  position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
  background: radial-gradient(ellipse at var(--mx, 50%) var(--my, 50%), #ffffffaa 0%, #ffffff22 30%, transparent 62%);
  opacity: var(--g, 0);
}

.line {
  position: absolute; margin: 0; white-space: nowrap;
  font-weight: 900; font-size: calc(9.9 * var(--u)); line-height: 1; letter-spacing: -0.01em; text-transform: uppercase;
  color: var(--fg); transform-style: preserve-3d; will-change: transform;
}
.l1 { left: calc(1.4 * var(--u)); top: calc(13.6 * var(--u)); display: flex; align-items: center; gap: calc(1.1 * var(--u)); }
.l2 { left: calc(17.1 * var(--u)); top: calc(21.4 * var(--u)); }
.dials { display: flex; gap: calc(.7 * var(--u)); transform: translateY(calc(.3 * var(--u))); }
.dial { width: calc(5.4 * var(--u)); height: calc(5.4 * var(--u)); color: var(--fg); overflow: visible; }
.dial .ring { transform-origin: 50px 50px; transform: rotate(var(--dial, 0deg)); }
.dial .spin { transform-origin: 50px 50px; animation: spin 30s linear infinite; }
.dial .rev { animation-direction: reverse; }
.dial text { font-family: var(--font); font-weight: 700; font-size: 9.6px; letter-spacing: .16em; fill: currentColor; }
@keyframes spin { to { transform: rotate(360deg); } }

/* password field (states from Kristi's text field spec) */
.gate {
  touch-action: manipulation;
  position: absolute; left: 50%; top: calc(42.4 * var(--u));
  width: max(calc(29.6 * var(--u)), min(320px, calc(100vw - 32px)));
  transform: translateX(-50%);
  display: grid; gap: 10px; justify-items: center;
}
.gate label { font-size: max(14px, calc(1.1 * var(--u))); font-weight: 700; color: var(--fg); }
.field { position: relative; width: 100%; }
.field input {
  width: 100%; height: max(52px, calc(4.2 * var(--u)));
  padding: 0 56px; border-radius: 8px;
  background: var(--field); color: var(--fg);
  border: 1px solid var(--field-line);
  font: 500 max(16px, calc(1 * var(--u)))/1 var(--font); text-align: center; letter-spacing: .12em;
  outline: none; transition: border-color .15s, background-color .15s, box-shadow .15s;
}
.field input::placeholder { color: #7c7fa6; letter-spacing: .2em; }
.field input:hover { border-color: var(--lavender); }                              /* hover */
.field input:active { border-color: var(--lavender-strong); }                      /* pressed */
.field input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px #f4b4c822; } /* focused */
.field input:not(:placeholder-shown):not(:focus) { border-color: transparent; }   /* filled */
.field input:not(:placeholder-shown):not(:focus):hover { border-color: var(--lavender); } /* filled hover */
.field input:disabled { background: var(--disabled-bg); color: var(--disabled-fg); border-color: var(--disabled-fg); cursor: progress; } /* disabled */
.field.is-error input, .field.is-error input:focus { border-color: var(--error); box-shadow: 0 0 0 3px #ff8a9b22; }
.go {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
  display: grid; place-items: center; background: transparent; color: var(--fg);
  opacity: 0; pointer-events: none; transition: opacity .15s, background-color .15s;
}
.field input:not(:placeholder-shown) ~ .go { opacity: 1; pointer-events: auto; }
.go:hover { background: #ffffff14; }
.go svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.helper { min-height: 20px; font-size: 14px; font-weight: 500; color: var(--pink); text-align: center; }
.helper.error { color: var(--error); }
.shake { animation: shake .4s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

.hint {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 5;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  font-size: 13px; font-weight: 600; letter-spacing: .02em; color: #f8f4f299; white-space: nowrap;
  transition: opacity .4s;
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .dial .spin { animation: none; }
  .shake { animation: none; }
}
</style>

  const reduced = matchMedia('(prefers-reduced-motion: reduce)');

  /* ---------- unlock transition: the card flips away, then the portfolio loads ---------- */
  function writePage(html) { document.open(); document.write(html); document.close(); }
  let firstLoad = true;
  function playUnlock(html) {
    if (firstLoad || reduced.matches) {
      if (!firstLoad) {
        document.body.style.transition = 'opacity .35s';
        document.body.style.opacity = '0';
        return setTimeout(() => writePage(html), 360);
      }
      return writePage(html);

    const card = $('flip-card'), text = $('flip-text'), gate = $('staticrypt-form');

    const u = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || innerWidth / 100;
    const dur = 900; let t0 = null;
    gate.style.transition = 'opacity .3s, transform .3s';
    gate.style.opacity = '0'; gate.style.transform = 'translateX(-50%) translateY(12px)';
    function step(now) {
      if (t0 === null) t0 = now;
      const x = clamp((now - t0) / dur, 0, 1);
      const p = x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2;
      const angle = p * 90, arc = Math.sin(angle * Math.PI / 180);
      card.style.transform = `translateY(${160 * arc}px) perspective(5800px) translateZ(${-100 * arc}px) rotateX(${angle}deg)`;
      lines.forEach((el, i) => {
        const y = (i === 0 ? -112 : -267) * arc, z = (i === 1 ? 1000 : 80) * arc;
        el.style.transform = `translateY(${y}px) perspective(5800px) translateZ(${z}px) rotateX(${angle}deg)`;
      });
      document.body.style.opacity = String(1 - Math.max(0, (x - .6) / .4));
      if (x < 1) requestAnimationFrame(step); else writePage(html);
    }
    requestAnimationFrame(step);
  }

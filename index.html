<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="robots" content="noindex, nofollow">
<title>Krisp Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;900&display=swap">
<style>
/* One fixed screen, no scroll. The featured lockup (card + badges + KRISP DESIGNS) is drawn at a fixed design size
   and scaled as one piece by script, so it never jumps between breakpoints and always fits the visible area. */
:root {
  --bg-top: #1e1f38;
  --bg-bottom: #0b0d1a;
  --card: #777777;
  --fg: #f8f4f2;
  --field: #0b0c18;
  --field-line: #2b2c55;
  --lavender: #a99cf5;
  --lavender-strong: #c9bcff;
  --pink: #f4b4c8;
  --disabled-bg: #262a4c;
  --disabled-fg: #8b84d8;
  --error: #ff8a9b;
  --btn: #2f2e52;
  --btn-hover: #252644;
  --btn-pressed: #1f1f38;
  --btn-icon: #aab3f7;
  --btn-icon-disabled: #545683;
  --ghost-icon: #e1d8f7;
  --ghost-hover: #332c4a;
  --ghost-pressed: #3c3456;
  --ghost-icon-disabled: #625a72;
  --ease: 250ms ease-in-out;
  --font: "Figtree", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) fixed;
  color: var(--fg); font-family: var(--font); -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; }

/* the visible area (shrinks when the phone keyboard opens) */
.vv { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; touch-action: none; visibility: hidden; }
.vv.ready { visibility: visible; }

/* icon button (secondary) */
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  display: grid; place-items: center;
  background: var(--btn); color: var(--btn-icon);
  outline: 2px solid transparent; outline-offset: 4px;
  transition: background-color var(--ease), color var(--ease), outline-color var(--ease), opacity var(--ease);
}
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:hover { background: var(--btn-hover); }
.icon-btn:active { background: var(--btn-pressed); }
.icon-btn:focus-visible { outline-color: var(--pink); }
.icon-btn:disabled { color: var(--btn-icon-disabled); cursor: not-allowed; background: var(--btn); }
.corner { position: absolute; z-index: 5; top: max(24px, env(safe-area-inset-top, 0px)); left: max(24px, env(safe-area-inset-left, 0px)); }
.toast {
  position: absolute; z-index: 5;
  top: calc(max(24px, env(safe-area-inset-top, 0px)) + 12px);
  left: calc(max(24px, env(safe-area-inset-left, 0px)) + 60px);
  font-size: 14px; font-weight: 600; color: var(--pink);
  opacity: 0; transform: translateX(-6px); transition: opacity var(--ease), transform var(--ease); pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }

/* featured lockup, at design size (card is 600px wide before scaling) */
.lockup {
  position: absolute; left: 50%; top: 0;
  width: 600px; height: var(--card-h, 619px);
  transform-origin: 50% 0;
  transform: translateX(-50%) scale(var(--s, 1));
}
.hover-card, .hover-text, .flip-card, .flip-text { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }
.hover-text { pointer-events: none; }
.card {
  position: absolute; inset: 0; border-radius: var(--card-r, 20px); background: var(--card); overflow: hidden;
  box-shadow: 0 48px 96px -38px #00000099;
}
.glare {
  position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
  background: radial-gradient(ellipse at var(--mx, 50%) var(--my, 50%), #ffffffaa 0%, #ffffff22 30%, transparent 62%);
  opacity: var(--g, 0);
}
.line {
  position: absolute; margin: 0; white-space: nowrap;
  font-weight: 900; font-size: var(--fs, 182px); line-height: 1; letter-spacing: -0.01em; text-transform: uppercase;
  color: var(--fg); transform-style: preserve-3d; will-change: transform;
}
.l1 { left: var(--l1x); top: var(--l1y); display: flex; align-items: center; gap: var(--l1gap); }
.l2 { left: var(--l2x); top: var(--l2y); }
.dials { display: flex; gap: var(--dgap); transform: translateY(calc(var(--fs) * .03)); }
.dial { width: var(--dial); height: var(--dial); color: var(--fg); overflow: visible; }
.dial .ring { transform-origin: 50px 50px; transform: rotate(var(--dial-rot, 0deg)); }
.dial .spin { transform-origin: 50px 50px; animation: spin 30s linear infinite; }
.dial .rev { animation-direction: reverse; }
.dial text { font-family: var(--font); font-weight: 700; font-size: 9.6px; letter-spacing: .16em; fill: currentColor; }
@keyframes spin { to { transform: rotate(360deg); } }

/* password form (stays at readable size; sits under the lockup) */
.gate {
  position: absolute; left: 50%; top: 0; transform: translateX(-50%);
  width: var(--gate-w, 360px);
  display: grid; gap: 10px; justify-items: center; touch-action: manipulation;
}
.gate label { font-size: var(--label-fs, 16px); font-weight: 700; color: var(--fg); }
.field { position: relative; width: 100%; }
.field input {
  width: 100%; height: var(--field-h, 56px);
  padding: 0 52px; border-radius: 8px;
  background: var(--field); color: var(--fg);
  border: 1px solid var(--field-line);
  font: 500 16px/1 var(--font); text-align: center; letter-spacing: .12em;
  outline: none; transition: border-color var(--ease), background-color var(--ease), color var(--ease), box-shadow var(--ease);
}
.field input::placeholder { color: #7c7fa6; letter-spacing: .2em; }
.field input:hover { border-color: var(--lavender); }
.field input:active { border-color: var(--lavender-strong); }
.field input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px #f4b4c822; }
.field input:not(:placeholder-shown):not(:focus) { border-color: transparent; }
.field input:not(:placeholder-shown):not(:focus):hover { border-color: var(--lavender); }
.field input:disabled { background: var(--disabled-bg); color: var(--disabled-fg); border-color: var(--disabled-fg); cursor: progress; }
.field.is-error input, .field.is-error input:focus { border-color: var(--error); box-shadow: 0 0 0 3px #ff8a9b22; }
.go { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); opacity: 0; pointer-events: none; }
/* ghost icon button (inside the field): 15% smaller than the 44px button */
.icon-btn.ghost { width: 38px; height: 38px; background: transparent; color: var(--ghost-icon); }
.icon-btn.ghost svg { width: 17px; height: 17px; }
.icon-btn.ghost:hover { background: var(--ghost-hover); }
.icon-btn.ghost:active { background: var(--ghost-pressed); }
.icon-btn.ghost:focus-visible { background: transparent; outline-color: var(--pink); }
.icon-btn.ghost:disabled { background: transparent; color: var(--ghost-icon-disabled); }
.field input:not(:placeholder-shown) ~ .go { opacity: 1; pointer-events: auto; }
.helper { margin: 0; min-height: 20px; font-size: 14px; font-weight: 500; color: var(--pink); text-align: center; }
.helper.error { color: var(--error); }
.shake { animation: shake .4s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .dial .spin { animation: none; }
  .shake { animation: none; }
}
</style>
</head>

          <span>Krisp</span>

              <circle cx="50" cy="50" r="9" fill="var(--pink)"/></svg>
            <svg class="dial" viewBox="0 0 100 100"><defs><path id="c2" d="M50 50 m-38 0 a38 38 0 1 1 76 0 a38 38 0 1 1 -76 0"/></defs>
              <g class="ring"><g class="spin rev"><circle cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="1.2"/><text><textPath href="#c2">LEARNING · INCLUSION · CRAFT · </textPath></text></g></g>
              <g fill="none" stroke="var(--lavender)" stroke-width="2"><circle cx="50" cy="50" r="11"/><path d="M50 39v22M39 50h22"/></g></svg>

        </div>
        <div class="line l2" id="l2" aria-hidden="true">Designs</div>

        <button class="icon-btn ghost go" type="submit" aria-label="Unlock portfolio">

      </div>
      <input id="staticrypt-remember" type="checkbox" name="remember" checked hidden>
      <p class="helper" id="helper" aria-live="polite"></p>

  </main>
</div>

    const from = { ...now }, t0 = nowT, span = endT - nowT;
    tween = { raf: 0, end: endT };
    const step = t => {
      const x = Math.min(1, (t - t0) / span), e = KB_EASE(x);
      now = { top: from.top + (target.top - from.top) * e, s: from.s + (target.s - from.s) * e };
      apply(now);
      if (x < 1) tween.raf = requestAnimationFrame(step); else tween = null;
    };
    tween.raf = requestAnimationFrame(step);
  }
  const queue = () => { if (!queued) { queued = true; requestAnimationFrame(layout); } };
  addEventListener('resize', queue);
  if (window.visualViewport) { visualViewport.addEventListener('resize', queue); visualViewport.addEventListener('scroll', queue); }
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { lastW = null; layout(); });
  // keep the page itself from being scrolled behind the keyboard
  addEventListener('scroll', () => { if (scrollY) scrollTo(0, 0); });

  /* ---------- unlock transition: the portfolio unmasks downward over the password screen ---------- */
  // tune these
  const UNLOCK_MS = 450;                         // length of the wipe
  const UNLOCK_EASE = bezier(.65, 0, .35, 1);    // ease-in-out
  const UNLOCK_SHIFT = .08;                      // password layout drifts down by this share of the screen height
  const UNLOCK_ROT = 60;                         // headline lines rotate in place by this many degrees
  function writePage(html) { document.open(); document.write(html); document.close(); }
  let firstLoad = true;
  function playUnlock(html) {
    if (firstLoad) return writePage(html);
    const C = window.__unlockCfg || {};
    const MS = C.ms != null ? C.ms : UNLOCK_MS, EASE = C.ease || UNLOCK_EASE;
    const SHIFT = C.shift != null ? C.shift : UNLOCK_SHIFT, ROT = C.rot != null ? C.rot : UNLOCK_ROT;
    const fast = reduced.matches;

    // the portfolio, drawn exactly as it will appear, on top of the password screen and fully masked
    const veil = document.createElement('iframe');
    veil.setAttribute('aria-hidden', 'true'); veil.tabIndex = -1;
    veil.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:50;background:transparent;pointer-events:none;clip-path:inset(0 0 100% 0);-webkit-clip-path:inset(0 0 100% 0)';
    veil.srcdoc = html;
    document.body.appendChild(veil);

    const mail = $('mail'), main = document.querySelector('main');
    [l1, l2].forEach(el => { el.style.transformOrigin = '50% 55%'; });
    const H = (window.visualViewport ? visualViewport.height : innerHeight);

    let started = false;
    const go = () => {
      if (started) return; started = true;
      if (fast) { veil.style.transition = 'opacity .25s'; veil.style.clipPath = veil.style.webkitClipPath = 'none'; veil.style.opacity = '0';
        requestAnimationFrame(() => { veil.style.opacity = '1'; }); return setTimeout(() => writePage(html), 280); }
      let t0 = null;
      const step = now => {
        if (t0 === null) t0 = now;
        const x = clamp((now - t0) / MS, 0, 1), e = EASE(x);
        const clip = `inset(0 0 ${((1 - e) * 100).toFixed(3)}% 0)`;
        veil.style.clipPath = clip; veil.style.webkitClipPath = clip;
        const dy = (e * SHIFT * H).toFixed(2);
        main.style.transform = `translateY(${dy}px)`;
        mail.style.transform = `translateY(${dy}px)`;
        [l1, l2].forEach(el => { el.style.transform = `perspective(1400px) rotateX(${(e * ROT).toFixed(2)}deg)`; });
        if (x < 1) requestAnimationFrame(step); else writePage(html);
      };
      requestAnimationFrame(step);
    };
    // start once the portfolio has painted (fonts included), but never wait more than 700ms
    veil.addEventListener('load', () => {
      try { const d = veil.contentDocument; (d.fonts && d.fonts.ready ? d.fonts.ready : Promise.resolve()).then(go); } catch (_) { go(); }
    });
    setTimeout(go, 700);
  }

  const staticrypt = staticryptInitiator.init(staticryptConfig, {
    rememberExpirationKey: "staticrypt_expiration",
    rememberPassphraseKey: "staticrypt_passphrase",
    replaceHtmlCallback: playUnlock,
    clearLocalStorageCallback: null,
  });
  window.onload = async () => {
    const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
    firstLoad = false;
    if (!isSuccessful) {
      const input = $('staticrypt-password');
      input.disabled = false;
      if (fine.matches) input.focus({ preventScroll: true });
    }
  };

  /* ---------- form ---------- */
  const field = $('field'), helper = $('helper'), input = $('staticrypt-password');
  input.addEventListener('input', () => {
    if (field.classList.contains('is-error')) { field.classList.remove('is-error'); helper.textContent = ''; helper.className = 'helper'; }
  });
  input.addEventListener('focus', () => { setTimeout(queue, 50); setTimeout(queue, 400); });
  input.addEventListener('blur', () => { setTimeout(queue, 50); setTimeout(queue, 400); });
  gate.addEventListener('submit', async e => {
    e.preventDefault();
    if (!input.value) { input.focus(); return; }
    input.disabled = true;
    helper.className = 'helper'; helper.textContent = 'Checking…';
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(input.value, $('staticrypt-remember').checked);
    if (!isSuccessful) {
      input.disabled = false;
      field.classList.add('is-error');
      helper.className = 'helper error';
      helper.textContent = "That password didn't work.";
      field.classList.remove('shake'); void field.offsetWidth; field.classList.add('shake');
      input.select(); input.focus();
    } else {
      helper.textContent = '';
    }
  });

  /* ---------- tilt: the card tilts hard, the headline plane tilts as one flat unit ---------- */
  const hoverCard = $('hover-card'), hoverText = $('hover-text'), glare = $('glare');
  const dials = [...document.querySelectorAll('.dial .ring')];
  const CARD = 34, TEXT = 14;
  const cur = { rx: 0, ry: 0, mx: 50, my: 50, g: 0 }, tgt = { ...cur };
  let raf = null, last = null;
  function onMove(e) {
    if (!fine.matches || reduced.matches) return;
    const x = clamp(e.clientX / innerWidth, 0, 1), y = clamp(e.clientY / innerHeight, 0, 1);
    tgt.ry = 28 * Math.tanh((x - .5) * 3.6) / Math.tanh(1.8);
    tgt.rx = (y - .5) * -40;
    const r = hoverCard.getBoundingClientRect();
    tgt.mx = clamp((e.clientX - r.left) / r.width * 100, -20, 120);
    tgt.my = clamp((e.clientY - r.top) / r.height * 100, -20, 120);
    tgt.g = 1; start();
  }
  function rest() { tgt.rx = tgt.ry = 0; tgt.g = 0; start(); }
  function start() { if (raf === null) { last = null; raf = requestAnimationFrame(tick); } }
  function tick(now) {
    const dt = last === null ? 16.7 : Math.min(64, now - last); last = now;
    const k = 1 - Math.exp(-dt / 80); let left = 0;
    for (const key in cur) { cur[key] += (tgt[key] - cur[key]) * k; left += Math.abs(tgt[key] - cur[key]); }
    // perspective is in design px, so phones get the same depth as desktop
    hoverCard.style.transform = `perspective(1725px) rotateX(${cur.rx * CARD / 28}deg) rotateY(${cur.ry * CARD / 28}deg)`;
    hoverText.style.transform = `perspective(2300px) rotateX(${cur.rx * TEXT / 28}deg) rotateY(${cur.ry * TEXT / 28}deg)`;
    glare.style.setProperty('--mx', cur.mx + '%'); glare.style.setProperty('--my', cur.my + '%');
    glare.style.setProperty('--g', (cur.g * .8).toFixed(3));
    dials.forEach(d => d.style.setProperty('--dial-rot', (cur.ry / 28 * 110).toFixed(1) + 'deg'));
    raf = left > .02 ? requestAnimationFrame(tick) : null;
  }
  addEventListener('pointermove', onMove);
  document.addEventListener('pointerleave', rest);
  addEventListener('blur', rest);

  /* ---------- phones: tilt with the device (gyro), or drag the card ---------- */
  const isTouch = matchMedia('(hover: none)').matches || (navigator.maxTouchPoints > 0 && !fine.matches);
  let base = null, gyroOn = false, dragging = false;
  function onOrient(e) {
    if (reduced.matches || e.beta == null || e.gamma == null || dragging) return;
    const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    let lr = e.gamma, fb = e.beta;
    if (ang === 90) { lr = e.beta; fb = -e.gamma; } else if (ang === -90 || ang === 270) { lr = -e.beta; fb = e.gamma; }
    if (!base) base = { lr, fb };
    base.lr += (lr - base.lr) * .015; base.fb += (fb - base.fb) * .015;
    const dx = clamp(lr - base.lr, -30, 30), dy = clamp(fb - base.fb, -30, 30);
    tgt.ry = 28 * Math.tanh(dx / 14);
    tgt.rx = -20 * Math.tanh(dy / 14);
    tgt.mx = 50 + dx * 2; tgt.my = 50 + dy * 2; tgt.g = .8;
    start();
  }
  function listenGyro() { if (gyroOn) return; gyroOn = true; addEventListener('deviceorientation', onOrient); }
  function askOnTap() {
    // iPhone only shares motion after a tap; nothing on screen, the first tap on the lockup asks quietly
    lockup.addEventListener('click', function once() {
      lockup.removeEventListener('click', once);
      DeviceOrientationEvent.requestPermission().catch(() => {});
    });
  }
  if (isTouch && !reduced.matches && 'DeviceOrientationEvent' in window) {
    listenGyro();
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(r => { if (r !== 'granted') askOnTap(); }).catch(askOnTap);
    }
  }
  // drag: press anywhere outside the form and move
  vv.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || reduced.matches || e.target.closest('form, button')) return;
    dragging = true; dragTo(e);
  });
  function dragTo(e) {
    const r = hoverCard.getBoundingClientRect();
    const x = clamp((e.clientX - r.left) / r.width, -.2, 1.2), y = clamp((e.clientY - r.top) / r.height, -.2, 1.2);
    tgt.ry = 28 * Math.tanh((x - .5) * 3.6) / Math.tanh(1.8); tgt.rx = (y - .5) * -40;
    tgt.mx = x * 100; tgt.my = y * 100; tgt.g = .9; start();
  }
  addEventListener('pointermove', e => { if (dragging) dragTo(e); });
  const endDrag = () => { if (dragging) { dragging = false; rest(); } };
  addEventListener('pointerup', endDrag); addEventListener('pointercancel', endDrag);

  /* ---------- email ---------- */
  const toast = $('toast');
  $('mail').addEventListener('click', () => {
    const show = m => { toast.textContent = m; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2400); };
    try { navigator.clipboard.writeText('kristipagdanganan@gmail.com').then(() => show('Email copied'), () => show('kristipagdanganan@gmail.com')); }
    catch (_) { show('kristipagdanganan@gmail.com'); }
  });
</script>

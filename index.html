<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Krisp Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;900&display=swap">
<style>
/* One fixed screen, no scroll. Composition is drawn in "u" units (1u ≈ 19px at 1920×1080) so it scales as one piece. */
:root {
  --bg-top: #1e1f38;
  --bg-bottom: #0b0d1a;
  --card: #777777;
  --fg: #f8f4f2;
  --field: #0b0c18;
  --field-line: #2b2c55;
  --lavender: #a99cf5;
  --lavender-strong: #c9bcff;
  --pink: #f4b4c8;
  --disabled-bg: #262a4c;
  --disabled-fg: #8b84d8;
  --error: #ff8a9b;
  --btn: #2f2e52;
  --btn-hover: #252644;
  --btn-pressed: #1f1f38;
  --btn-icon: #aab3f7;
  --btn-icon-disabled: #545683;
  --ease: 250ms ease-in-out;
  --font: "Figtree", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --u: min(1vw, 1.78vh);
  color-scheme: dark;

@media (max-aspect-ratio: 1/1) { :root { --u: min(1.45vw, 1.6vh); } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) fixed;
  color: var(--fg); font-family: var(--font); -webkit-font-smoothing: antialiased;
}
.hidden { display: none !important; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; }

/* corner email */
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  display: grid; place-items: center;
  background: var(--btn); color: var(--btn-icon);
  outline: 2px solid transparent; outline-offset: 4px;
  transition: background-color var(--ease), color var(--ease), outline-color var(--ease);
}
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:hover { background: var(--btn-hover); }
.icon-btn:active { background: var(--btn-pressed); }
.icon-btn:focus-visible { outline-color: var(--pink); }
.icon-btn:disabled { color: var(--btn-icon-disabled); cursor: not-allowed; background: var(--btn); }
.corner {
  position: fixed; z-index: 5;
  top: max(24px, env(safe-area-inset-top, 0px)); left: max(24px, env(safe-area-inset-left, 0px));
}
.toast {
  position: fixed; z-index: 5;
  top: calc(max(24px, env(safe-area-inset-top, 0px)) + 12px);
  left: calc(max(24px, env(safe-area-inset-left, 0px)) + 60px);
  font-size: 14px; font-weight: 600; color: var(--pink);
  opacity: 0; transform: translateX(-6px); transition: opacity var(--ease), transform var(--ease); pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }

/* stage */
.stage { position: fixed; inset: 0; display: grid; place-items: center; touch-action: none; }
.comp { position: relative; width: calc(60 * var(--u)); height: calc(50 * var(--u)); }

.hover-card, .hover-text, .flip-card, .flip-text { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }
.hover-text { pointer-events: none; }

.card {
  position: absolute; left: calc(13.7 * var(--u)); top: 0;
  width: calc(32.6 * var(--u)); height: calc(33.6 * var(--u));
  border-radius: calc(1.05 * var(--u)); background: var(--card); overflow: hidden;
  box-shadow: 0 calc(2.5 * var(--u)) calc(5 * var(--u)) calc(-2 * var(--u)) #00000099;
}
.glare {
  position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
  background: radial-gradient(ellipse at var(--mx, 50%) var(--my, 50%), #ffffffaa 0%, #ffffff22 30%, transparent 62%);
  opacity: var(--g, 0);
}

.line {
  position: absolute; margin: 0; white-space: nowrap;
  font-weight: 900; font-size: calc(9.9 * var(--u)); line-height: 1; letter-spacing: -0.01em; text-transform: uppercase;
  color: var(--fg); transform-style: preserve-3d; will-change: transform;
}
.l1 { left: calc(1.4 * var(--u)); top: calc(13.6 * var(--u)); display: flex; align-items: center; gap: calc(1.1 * var(--u)); }
.l2 { left: calc(17.1 * var(--u)); top: calc(21.4 * var(--u)); }
.dials { display: flex; gap: calc(.7 * var(--u)); transform: translateY(calc(.3 * var(--u))); }
.dial { width: calc(5.4 * var(--u)); height: calc(5.4 * var(--u)); color: var(--fg); overflow: visible; }
.dial .ring { transform-origin: 50px 50px; transform: rotate(var(--dial, 0deg)); }
.dial .spin { transform-origin: 50px 50px; animation: spin 30s linear infinite; }
.dial .rev { animation-direction: reverse; }
.dial text { font-family: var(--font); font-weight: 700; font-size: 9.6px; letter-spacing: .16em; fill: currentColor; }
@keyframes spin { to { transform: rotate(360deg); } }

/* password field (states from Kristi's text field spec) */
.gate {
  touch-action: manipulation;
  position: absolute; left: 50%; top: calc(42.4 * var(--u));
  width: max(calc(29.6 * var(--u)), min(320px, calc(100vw - 32px)));
  transform: translateX(-50%);

  padding: 0 56px; border-radius: 8px;
  background: var(--field); color: var(--fg);
  border: 1px solid var(--field-line);
  font: 500 max(16px, calc(1 * var(--u)))/1 var(--font); text-align: center; letter-spacing: .12em;
  outline: none; transition: border-color var(--ease), background-color var(--ease), color var(--ease), box-shadow var(--ease);

.field input:hover { border-color: var(--lavender); }                              /* hover */
.field input:active { border-color: var(--lavender-strong); }                      /* pressed */
.field input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px #f4b4c822; } /* focused */
.field input:not(:placeholder-shown):not(:focus) { border-color: transparent; }   /* filled */
.field input:not(:placeholder-shown):not(:focus):hover { border-color: var(--lavender); } /* filled hover */
.field input:disabled { background: var(--disabled-bg); color: var(--disabled-fg); border-color: var(--disabled-fg); cursor: progress; } /* disabled */
.field.is-error input, .field.is-error input:focus { border-color: var(--error); box-shadow: 0 0 0 3px #ff8a9b22; }
.go {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  opacity: 0; pointer-events: none;
  transition: opacity var(--ease), background-color var(--ease), color var(--ease), outline-color var(--ease);
}
.field input:not(:placeholder-shown) ~ .go { opacity: 1; pointer-events: auto; }
.field input { padding: 0 60px; }
.helper { min-height: 20px; font-size: 14px; font-weight: 500; color: var(--pink); text-align: center; }
.helper.error { color: var(--error); }
.shake { animation: shake .4s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

@media (max-width: 600px) {
  .comp { width: 100vw; height: calc(99.5vw + 225px); }
  .card { left: 10vw; width: 80vw; height: 99.5vw; border-radius: 3vw; }
  .line { font-size: 18.6vw; }
  .l1 { left: 3vw; top: 52.1vw; gap: 2vw; }
  .l2 { left: 14.8vw; top: 69.9vw; }
  .dials { gap: 1.3vw; transform: translateY(.6vw); }
  .dial { width: 10.1vw; height: 10.1vw; }
  .gate { top: calc(99.5vw + 36px); width: calc(100vw - 32px); }
  .gate label { font-size: 15px; }
  .field input { height: 56px; }
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .dial .spin { animation: none; }
  .shake { animation: none; }
}
</style>

  /* ---------- unlock transition: the card flips away, then the portfolio loads ---------- */
  function writePage(html) { document.open(); document.write(html); document.close(); }
  let firstLoad = true;
  function playUnlock(html) {
    if (firstLoad || reduced.matches) {
      if (!firstLoad) {
        document.body.style.transition = 'opacity .35s';
        document.body.style.opacity = '0';
        return setTimeout(() => writePage(html), 360);
      }
      return writePage(html);
    }
    const card = $('flip-card'), text = $('flip-text'), gate = $('staticrypt-form');
    const lines = [...document.querySelectorAll('.line')];
    const u = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || innerWidth / 100;
    const dur = 900; let t0 = null;
    gate.style.transition = 'opacity .3s, transform .3s';
    gate.style.opacity = '0'; gate.style.transform = 'translateX(-50%) translateY(12px)';
    function step(now) {
      if (t0 === null) t0 = now;
      const x = clamp((now - t0) / dur, 0, 1);
      const p = x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2;
      const angle = p * 90, arc = Math.sin(angle * Math.PI / 180);
      card.style.transform = `translateY(${160 * arc}px) perspective(5800px) translateZ(${-100 * arc}px) rotateX(${angle}deg)`;
      lines.forEach((el, i) => {
        const y = (i === 0 ? -112 : -267) * arc, z = (i === 1 ? 1000 : 80) * arc;
        el.style.transform = `translateY(${y}px) perspective(5800px) translateZ(${z}px) rotateX(${angle}deg)`;
      });
      document.body.style.opacity = String(1 - Math.max(0, (x - .6) / .4));
      if (x < 1) requestAnimationFrame(step); else writePage(html);
    }
    requestAnimationFrame(step);
  }

  const staticrypt = staticryptInitiator.init(staticryptConfig, {
    rememberExpirationKey: "staticrypt_expiration",
    rememberPassphraseKey: "staticrypt_passphrase",
    replaceHtmlCallback: playUnlock,
    clearLocalStorageCallback: null,
  });

  window.onload = async () => {
    const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
    firstLoad = false;
    if (!isSuccessful) {
      const input = $('staticrypt-password');
      input.disabled = false;
      if (fine.matches) input.focus({ preventScroll: true });
    }
  };

  /* ---------- form ---------- */
  const field = $('field'), helper = $('helper'), input = $('staticrypt-password');
  input.addEventListener('input', () => {
    if (field.classList.contains('is-error')) { field.classList.remove('is-error'); helper.textContent = ''; helper.className = 'helper'; }
  });
  $('staticrypt-form').addEventListener('submit', async e => {
    e.preventDefault();
    if (!input.value) { input.focus(); return; }
    input.disabled = true;
    helper.className = 'helper'; helper.textContent = 'Checking…';
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(input.value, $('staticrypt-remember').checked);
    if (!isSuccessful) {
      input.disabled = false;
      field.classList.add('is-error');
      helper.className = 'helper error';
      helper.textContent = "That password didn't work.";
      field.classList.remove('shake'); void field.offsetWidth; field.classList.add('shake');
      input.select(); input.focus();
    } else {
      helper.textContent = '';
    }
  });

  /* ---------- hover tilt: card tilts hard, the headline plane tilts as one flat unit ---------- */
  const hoverCard = $('hover-card'), hoverText = $('hover-text'), glare = $('glare');
  const dials = [...document.querySelectorAll('.dial .ring')];
  const CARD = 34, TEXT = 12;
  const cur = { rx: 0, ry: 0, mx: 50, my: 50, g: 0 }, tgt = { ...cur };
  let raf = null, last = null;
  function onMove(e) {
    if (!fine.matches || reduced.matches) return;
    const x = clamp(e.clientX / innerWidth, 0, 1), y = clamp(e.clientY / innerHeight, 0, 1);
    tgt.ry = 28 * Math.tanh((x - .5) * 3.6) / Math.tanh(1.8);
    tgt.rx = (y - .5) * -40;
    const r = document.querySelector('.card').getBoundingClientRect();
    tgt.mx = clamp((e.clientX - r.left) / r.width * 100, -20, 120);
    tgt.my = clamp((e.clientY - r.top) / r.height * 100, -20, 120);
    tgt.g = 1; start();
  }
  function rest() { tgt.rx = tgt.ry = 0; tgt.g = 0; start(); }
  function start() { if (raf === null) { last = null; raf = requestAnimationFrame(tick); } }
  function tick(now) {
    const dt = last === null ? 16.7 : Math.min(64, now - last); last = now;
    const k = 1 - Math.exp(-dt / 80); let left = 0;
    for (const key in cur) { cur[key] += (tgt[key] - cur[key]) * k; left += Math.abs(tgt[key] - cur[key]); }
    hoverCard.style.transform = `perspective(1800px) rotateX(${cur.rx * CARD / 28}deg) rotateY(${cur.ry * CARD / 28}deg)`;
    hoverText.style.transform = `perspective(2400px) rotateX(${cur.rx * TEXT / 28}deg) rotateY(${cur.ry * TEXT / 28}deg)`;
    glare.style.setProperty('--mx', cur.mx + '%'); glare.style.setProperty('--my', cur.my + '%');
    glare.style.setProperty('--g', (cur.g * .8).toFixed(3));
    dials.forEach(d => d.style.setProperty('--dial', (cur.ry / 28 * 110).toFixed(1) + 'deg'));
    raf = left > .02 ? requestAnimationFrame(tick) : null;
  }
  addEventListener('pointermove', onMove);
  document.addEventListener('pointerleave', rest);
  addEventListener('blur', rest);


  /* ---------- phones: tilt with the device (gyro), or drag the card ---------- */
  const isTouch = matchMedia('(hover: none)').matches || navigator.maxTouchPoints > 0 && !fine.matches;
  let base = null, gyroOn = false;
  function onOrient(e) {
    if (reduced.matches || e.beta == null || e.gamma == null) return;
    // account for landscape: swap axes so "left/right" stays left/right on screen
    const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    let lr = e.gamma, fb = e.beta;
    if (ang === 90) { lr = e.beta; fb = -e.gamma; } else if (ang === -90 || ang === 270) { lr = -e.beta; fb = e.gamma; }
    if (!base) base = { lr, fb };
    // the resting angle slowly follows how the phone is held, so the card settles back to flat
    base.lr += (lr - base.lr) * .015; base.fb += (fb - base.fb) * .015;
    const dx = clamp(lr - base.lr, -30, 30), dy = clamp(fb - base.fb, -30, 30);
    tgt.ry = 28 * Math.tanh(dx / 14);
    tgt.rx = -20 * Math.tanh(dy / 14);
    tgt.mx = 50 + dx * 2; tgt.my = 50 + dy * 2; tgt.g = .8;
    start();
  }
  function listenGyro() {
    if (gyroOn) return; gyroOn = true;
    addEventListener('deviceorientation', onOrient);
  }
  function askOnTap() {
    // iPhone only shares motion after a tap; nothing on screen, the first tap on the card asks quietly
    $('comp').addEventListener('click', function once(e) {
      if (e.target.closest('form')) return;
      $('comp').removeEventListener('click', once);
      DeviceOrientationEvent.requestPermission().catch(() => {});
    });
  }
  if (isTouch && !reduced.matches && 'DeviceOrientationEvent' in window) {
    listenGyro(); // Android and most browsers start sending motion right away
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      // iPhone needs a tap before it shares motion; try silently first in case access was already granted
      DeviceOrientationEvent.requestPermission().then(r => { if (r !== 'granted') askOnTap(); }).catch(askOnTap);
    }
  }
  // drag fallback: press and move on the card
  let dragging = false;
  $('stage').addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || reduced.matches || e.target.closest('form')) return;
    dragging = true;
  });
  addEventListener('pointermove', e => {
    if (!dragging) return;
    const x = clamp(e.clientX / innerWidth, 0, 1), y = clamp(e.clientY / innerHeight, 0, 1);
    tgt.ry = 28 * Math.tanh((x - .5) * 3.6) / Math.tanh(1.8); tgt.rx = (y - .5) * -40; tgt.g = .8; start();
  });
  addEventListener('pointerup', () => { if (dragging) { dragging = false; rest(); } });
  addEventListener('pointercancel', () => { if (dragging) { dragging = false; rest(); } });

  /* ---------- email ---------- */
  const toast = $('toast');
  $('mail').addEventListener('click', () => {
    const show = m => { toast.textContent = m; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2400); };
    try { navigator.clipboard.writeText('kristipagdanganan@gmail.com').then(() => show('Email copied'), () => show('kristipagdanganan@gmail.com')); }
    catch (_) { show('kristipagdanganan@gmail.com'); }
  });
</script>
</body>
